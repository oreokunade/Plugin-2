<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A1A"/>
      <stop offset="100%" style="stop-color:#0D1A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00EFFE"/>
      <stop offset="100%" style="stop-color:#0C5BEE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C842"/>
      <stop offset="100%" style="stop-color:#E8A020"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff08" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#ffffff08" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#ffffff08" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#ffffff08" stroke-width="1"/>

  <!-- Accent bar -->
  <rect x="80" y="185" width="3" height="80" fill="url(#accent)" rx="2"/>

  <!-- Logo mark — geometric diamond -->
  <polygon points="340,160 380,200 340,240 300,200" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <polygon points="340,175 365,200 340,225 315,200" fill="url(#gold)" opacity="0.15"/>
  <line x1="340" y1="160" x2="340" y2="240" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="200" x2="380" y2="200" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>

  <!-- Wordmark -->
  <text x="400" y="197" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#F5C842" letter-spacing="8" text-anchor="start">NOVA</text>
  <text x="400" y="220" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#ffffff50" letter-spacing="4" text-anchor="start">FINANCIAL SERVICES</text>

  <!-- Accent line under wordmark -->
  <rect x="400" y="228" width="120" height="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Label -->
  <rect x="80" y="310" width="160" height="28" rx="4" fill="#ffffff08"/>
  <text x="160" y="329" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff60" text-anchor="middle" letter-spacing="2">BRAND IDENTITY</text>

  <!-- Corner details -->
  <circle cx="680" cy="120" r="60" fill="none" stroke="#00EFFE" stroke-width="0.5" opacity="0.2"/>
  <circle cx="680" cy="120" r="40" fill="none" stroke="#00EFFE" stroke-width="0.5" opacity="0.15"/>
  <circle cx="680" cy="120" r="20" fill="#00EFFE" opacity="0.06"/>

  <!-- Small decorative dots -->
  <circle cx="120" cy="370" r="2" fill="#00EFFE" opacity="0.4"/>
  <circle cx="132" cy="370" r="2" fill="#00EFFE" opacity="0.25"/>
  <circle cx="144" cy="370" r="2" fill="#00EFFE" opacity="0.15"/>
</svg>