<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C842"/>
      <stop offset="100%" style="stop-color:#E8A020"/>
    </linearGradient>
  </defs>

  <!-- Light background -->
  <rect width="600" height="600" fill="#F4F1EB"/>

  <!-- Business card mockup — clean -->
  <rect x="70" y="100" width="460" height="280" rx="12" fill="#0A0A1A" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.18))"/>

  <!-- Card content -->
  <!-- Diamond mark -->
  <polygon points="115,195 135,215 115,235 95,215" fill="none" stroke="#F5C842" stroke-width="1.5"/>
  <circle cx="115" cy="215" r="2.5" fill="#F5C842"/>

  <!-- Name -->
  <text x="155" y="205" font-family="Georgia, serif" font-size="18" font-weight="700" fill="white" letter-spacing="1">Chidi Okonkwo</text>
  <text x="155" y="225" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff60" letter-spacing="1">Managing Director</text>

  <!-- Thin rule -->
  <rect x="155" y="238" width="200" height="0.5" fill="#ffffff20"/>

  <!-- Contact -->
  <text x="155" y="258" font-family="system-ui, sans-serif" font-size="9.5" fill="#ffffff50" letter-spacing="0.5">+234 801 234 5678</text>
  <text x="155" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#ffffff50" letter-spacing="0.5">chidi@novafinancial.ng</text>

  <!-- Wordmark right side -->
  <text x="480" y="195" font-family="Georgia, serif" font-size="16" font-weight="700" fill="white" text-anchor="end" letter-spacing="4">NOVA</text>
  <rect x="375" y="200" width="105" height="0.5" fill="#F5C842" opacity="0.5"/>
  <text x="480" y="214" font-family="system-ui, sans-serif" font-size="7.5" fill="#ffffff40" text-anchor="end" letter-spacing="2">FINANCIAL</text>

  <!-- Gold corner accent -->
  <polygon points="470,108 530,108 530,148" fill="#F5C842" opacity="0.15" rx="12"/>

  <!-- Brand guidelines preview below card -->
  <rect x="70" y="420" width="100" height="100" rx="8" fill="white"/>
  <rect x="70" y="420" width="100" height="40" rx="8" fill="#0A0A1A"/>
  <rect x="70" y="452" width="100" height="8" fill="#0A0A1A"/>
  <text x="120" y="444" font-family="Georgia, serif" font-size="8" fill="white" text-anchor="middle" letter-spacing="2">NOVA</text>
  <rect x="82" y="470" width="16" height="16" rx="3" fill="#0A0A1A"/>
  <rect x="104" y="470" width="16" height="16" rx="3" fill="#F5C842"/>
  <rect x="126" y="470" width="16" height="16" rx="3" fill="#1A3050"/>
  <text x="120" y="506" font-family="system-ui, sans-serif" font-size="7" fill="#888" text-anchor="middle">Brand Guidelines</text>

  <rect x="190" y="420" width="160" height="100" rx="8" fill="white"/>
  <text x="270" y="445" font-family="Georgia, serif" font-size="22" fill="#0A0A1A" text-anchor="middle" font-weight="700">Aa</text>
  <text x="270" y="466" font-family="Georgia, serif" font-size="9" fill="#0A0A1A" text-anchor="middle" opacity="0.5">Primary Typeface</text>
  <text x="270" y="482" font-family="system-ui, sans-serif" font-size="8" fill="#888" text-anchor="middle" letter-spacing="1">GEORGIA SERIF</text>
  <rect x="210" y="492" width="120" height="0.5" fill="#e0e0e0"/>
  <text x="270" y="506" font-family="system-ui, sans-serif" font-size="7" fill="#888" text-anchor="middle">Secondary · System UI</text>

  <rect x="370" y="420" width="160" height="100" rx="8" fill="#0A0A1A"/>
  <polygon points="450,448 465,463 450,478 435,463" fill="none" stroke="#F5C842" stroke-width="1.5"/>
  <circle cx="450" cy="463" r="3" fill="#F5C842"/>
  <text x="450" y="496" font-family="Georgia, serif" font-size="9" fill="white" text-anchor="middle" letter-spacing="3">NOVA</text>
  <text x="450" y="509" font-family="system-ui, sans-serif" font-size="7" fill="#ffffff40" text-anchor="middle" letter-spacing="1">FINANCIAL SERVICES</text>

  <!-- AFTER label -->
  <rect x="20" y="20" width="80" height="28" rx="4" fill="#22c55e"/>
  <text x="60" y="39" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">AFTER</text>
</svg>