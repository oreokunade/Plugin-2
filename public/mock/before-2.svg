<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Old business card / letterhead -->
  <rect width="600" height="600" fill="#EAE6DF"/>

  <!-- Old letterhead mockup -->
  <rect x="60" y="60" width="480" height="480" rx="0" fill="white" stroke="#d0c8b8" stroke-width="1"/>

  <!-- Header bar - garish -->
  <rect x="60" y="60" width="480" height="80" fill="#1A3A6B"/>
  <rect x="60" y="60" width="480" height="8" fill="#C8A020"/>

  <!-- Logo in header -->
  <text x="120" y="108" font-family="Times New Roman, serif" font-size="22" fill="white" font-weight="bold">NOVA CAPITAL</text>
  <text x="120" y="124" font-family="Arial, sans-serif" font-size="9" fill="#C8A020" letter-spacing="2">INVESTMENT SOLUTIONS LTD.</text>

  <!-- Contact block in header -->
  <text x="500" y="96" font-family="Arial, sans-serif" font-size="9" fill="#aabbcc" text-anchor="end">Tel: 080-1234-5678</text>
  <text x="500" y="110" font-family="Arial, sans-serif" font-size="9" fill="#aabbcc" text-anchor="end">nova@capitalng.com</text>
  <text x="500" y="124" font-family="Arial, sans-serif" font-size="9" fill="#aabbcc" text-anchor="end">www.novacapitalng.com</text>

  <!-- Body content lines -->
  <rect x="100" y="180" width="340" height="8" rx="2" fill="#e0d8cc"/>
  <rect x="100" y="198" width="300" height="8" rx="2" fill="#e0d8cc"/>
  <rect x="100" y="216" width="320" height="8" rx="2" fill="#e0d8cc"/>
  <rect x="100" y="234" width="180" height="8" rx="2" fill="#e0d8cc"/>

  <rect x="100" y="264" width="340" height="8" rx="2" fill="#e0d8cc"/>
  <rect x="100" y="282" width="280" height="8" rx="2" fill="#e0d8cc"/>
  <rect x="100" y="300" width="310" height="8" rx="2" fill="#e0d8cc"/>

  <!-- Clipart-style stamp -->
  <circle cx="460" cy="380" r="50" fill="none" stroke="#1A3A6B" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="460" y="374" font-family="Arial, sans-serif" font-size="9" fill="#1A3A6B" text-anchor="middle" font-weight="bold">NOVA</text>
  <text x="460" y="388" font-family="Arial, sans-serif" font-size="9" fill="#1A3A6B" text-anchor="middle" font-weight="bold">CAPITAL</text>

  <!-- Footer - cluttered -->
  <rect x="60" y="500" width="480" height="40" fill="#F5F0E8"/>
  <rect x="60" y="500" width="480" height="3" fill="#C8A020"/>
  <text x="300" y="522" font-family="Arial, sans-serif" font-size="8" fill="#888" text-anchor="middle">RC 1234567 | 14 Finance Close, Lagos Island, Lagos | ISO 9001:2015 Certified</text>

  <!-- BEFORE label -->
  <rect x="20" y="20" width="90" height="28" rx="4" fill="#e53e3e"/>
  <text x="65" y="39" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">BEFORE</text>
</svg>