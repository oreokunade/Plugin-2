<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C842"/>
      <stop offset="100%" style="stop-color:#E8A020"/>
    </linearGradient>
  </defs>

  <!-- Clean white background -->
  <rect width="600" height="600" fill="#FAFAFA"/>

  <!-- Minimal logo mark — diamond -->
  <polygon points="300,180 345,225 300,270 255,225" fill="none" stroke="#0A0A1A" stroke-width="2.5"/>
  <polygon points="300,197 328,225 300,253 272,225" fill="#0A0A1A" opacity="0.06"/>
  <!-- Gold accent dot -->
  <circle cx="300" cy="225" r="4" fill="url(#goldGrad)"/>

  <!-- Clean wordmark -->
  <text x="300" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#0A0A1A" text-anchor="middle" letter-spacing="10">NOVA</text>

  <!-- Thin rule -->
  <rect x="240" y="330" width="120" height="0.75" fill="#0A0A1A" opacity="0.2"/>

  <!-- Subtitle -->
  <text x="300" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0A0A1A" text-anchor="middle" letter-spacing="4" opacity="0.45">FINANCIAL SERVICES</text>

  <!-- Colour palette swatches at bottom -->
  <rect x="195" y="430" width="32" height="32" rx="6" fill="#0A0A1A"/>
  <rect x="237" y="430" width="32" height="32" rx="6" fill="#F5C842"/>
  <rect x="279" y="430" width="32" height="32" rx="6" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
  <rect x="321" y="430" width="32" height="32" rx="6" fill="#1A3050"/>
  <rect x="363" y="430" width="32" height="32" rx="6" fill="#E8A020"/>

  <!-- Palette label -->
  <text x="300" y="488" font-family="system-ui, sans-serif" font-size="9" fill="#999" text-anchor="middle" letter-spacing="2">BRAND COLOURS</text>

  <!-- AFTER label -->
  <rect x="20" y="20" width="80" height="28" rx="4" fill="#22c55e"/>
  <text x="60" y="39" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">AFTER</text>
</svg>