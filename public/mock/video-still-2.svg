<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="st2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080814"/>
      <stop offset="100%" style="stop-color:#0D1828"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00EFFE" stop-opacity="0.3"/>
      <stop offset="100%" style="stop-color:#0C5BEE" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#st2bg)"/>

  <!-- Letterbox -->
  <rect x="0" y="0" width="600" height="28" fill="black"/>
  <rect x="0" y="372" width="600" height="28" fill="black"/>

  <!-- Storyboard frames -->
  <text x="40" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff30" letter-spacing="3">STORYBOARD</text>

  <!-- Frame 1 -->
  <rect x="40" y="72" width="150" height="100" rx="6" fill="#1A2040" stroke="#00EFFE" stroke-width="0.5" stroke-opacity="0.4"/>
  <rect x="40" y="72" width="150" height="100" rx="6" fill="url(#screenGlow)"/>
  <text x="115" y="117" font-family="system-ui, sans-serif" font-size="8" fill="#00EFFE" text-anchor="middle" opacity="0.7">PRODUCT REVEAL</text>
  <text x="115" y="131" font-family="system-ui, sans-serif" font-size="7" fill="#ffffff30" text-anchor="middle">0:00 – 0:05</text>
  <rect x="40" y="168" width="150" height="12" rx="2" fill="#ffffff08"/>
  <text x="115" y="178" font-family="system-ui, sans-serif" font-size="7" fill="#ffffff30" text-anchor="middle">Cut in from black</text>

  <!-- Frame 2 -->
  <rect x="215" y="72" width="150" height="100" rx="6" fill="#1A2040" stroke="#00EFFE" stroke-width="0.5" stroke-opacity="0.4"/>
  <circle cx="290" cy="122" r="25" fill="#00EFFE" opacity="0.08"/>
  <text x="290" y="117" font-family="system-ui, sans-serif" font-size="8" fill="#00EFFE" text-anchor="middle" opacity="0.7">FEATURE CLOSE-UP</text>
  <text x="290" y="131" font-family="system-ui, sans-serif" font-size="7" fill="#ffffff30" text-anchor="middle">0:05 – 0:15</text>
  <rect x="215" y="168" width="150" height="12" rx="2" fill="#ffffff08"/>
  <text x="290" y="178" font-family="system-ui, sans-serif" font-size="7" fill="#ffffff30" text-anchor="middle">Slow zoom + rotate</text>

  <!-- Frame 3 -->
  <rect x="390" y="72" width="150" height="100" rx="6" fill="#1A2040" stroke="#00EFFE" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="465" y="117" font-family="system-ui, sans-serif" font-size="8" fill="#00EFFE" text-anchor="middle" opacity="0.7">CTA CARD</text>
  <text x="465" y="131" font-family="system-ui, sans-serif" font-size="7" fill="#ffffff30" text-anchor="middle">0:25 – 0:30</text>
  <!-- CTA suggestion on frame -->
  <rect x="415" y="140" width="100" height="18" rx="9" fill="#00EFFE" opacity="0.2"/>
  <text x="465" y="152" font-family="system-ui, sans-serif" font-size="7" fill="#00EFFE" text-anchor="middle" opacity="0.8">SHOP NOW</text>

  <!-- Color palette used -->
  <text x="40" y="230" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff30" letter-spacing="3">COLOR GRADE</text>
  <circle cx="60" cy="260" r="20" fill="#080810"/>
  <circle cx="108" cy="260" r="20" fill="#0D1428"/>
  <circle cx="156" cy="260" r="20" fill="#00EFFE" opacity="0.7"/>
  <circle cx="204" cy="260" r="20" fill="#0C5BEE" opacity="0.7"/>
  <circle cx="252" cy="260" r="20" fill="#F5C842" opacity="0.7"/>

  <!-- Duration bar -->
  <rect x="40" y="310" width="520" height="4" rx="2" fill="#ffffff10"/>
  <rect x="40" y="310" width="420" height="4" rx="2" fill="#00EFFE" opacity="0.5"/>
  <text x="40" y="330" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff30">0:00</text>
  <text x="560" y="330" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff30" text-anchor="end">0:30</text>
</svg>