<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080810"/>
      <stop offset="100%" style="stop-color:#101828"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#stBg)"/>

  <!-- Letterbox -->
  <rect x="0" y="0" width="600" height="30" fill="black"/>
  <rect x="0" y="370" width="600" height="30" fill="black"/>

  <!-- Behind the scenes: monitor with timeline -->
  <rect x="60" y="60" width="480" height="270" rx="8" fill="#1A2040" stroke="#ffffff10" stroke-width="1"/>
  <!-- Monitor screen -->
  <rect x="72" y="72" width="456" height="246" rx="4" fill="#0D1428"/>

  <!-- Editing timeline suggestion -->
  <rect x="80" y="260" width="440" height="48" rx="0" fill="#080810"/>
  <!-- Track rows -->
  <rect x="80" y="266" width="440" height="10" fill="#1A2040"/>
  <rect x="80" y="280" width="440" height="10" fill="#1A2040"/>
  <rect x="80" y="294" width="440" height="10" fill="#1A2040"/>
  <!-- Clip blocks -->
  <rect x="88" y="267" width="80" height="8" rx="2" fill="#00EFFE" opacity="0.5"/>
  <rect x="174" y="267" width="60" height="8" rx="2" fill="#00EFFE" opacity="0.35"/>
  <rect x="240" y="267" width="100" height="8" rx="2" fill="#00EFFE" opacity="0.5"/>
  <rect x="88" y="281" width="140" height="8" rx="2" fill="#FF6B9D" opacity="0.4"/>
  <rect x="234" y="281" width="90" height="8" rx="2" fill="#FF6B9D" opacity="0.35"/>
  <!-- Playhead -->
  <rect x="230" y="262" width="2" height="46" fill="#00EFFE" opacity="0.8"/>

  <!-- Screen preview frame -->
  <rect x="80" y="80" width="440" height="176" rx="2" fill="#0A1020"/>
  <!-- Frame content: product shot suggestion -->
  <rect x="200" y="100" width="200" height="136" rx="8" fill="#1A2040" opacity="0.6"/>
  <circle cx="300" cy="168" r="40" fill="#00EFFE" opacity="0.05"/>
  <text x="300" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff30" text-anchor="middle">FRAME 01</text>

  <!-- BTS label -->
  <rect x="80" y="340" width="200" height="20" rx="4" fill="black" opacity="0.5"/>
  <text x="180" y="354" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff50" text-anchor="middle" letter-spacing="2">BEHIND THE SCENES</text>
</svg>