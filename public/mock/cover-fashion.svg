<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="fashionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A1E"/>
      <stop offset="100%" style="stop-color:#2D0A2E"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D"/>
      <stop offset="100%" style="stop-color:#C44569"/>
    </linearGradient>
    <linearGradient id="warmGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFC3A0"/>
      <stop offset="100%" style="stop-color:#FFAFBD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#fashionBg)"/>

  <!-- Subtle texture grid -->
  <line x1="0" y1="112" x2="800" y2="112" stroke="#ffffff05" stroke-width="1"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="#ffffff05" stroke-width="1"/>
  <line x1="0" y1="337" x2="800" y2="337" stroke="#ffffff05" stroke-width="1"/>

  <!-- Left: stacked Instagram posts preview -->
  <rect x="60" y="60" width="160" height="160" rx="8" fill="#2A1030" stroke="#ffffff10" stroke-width="1"/>
  <rect x="60" y="60" width="160" height="80" rx="8" fill="#3D1540"/>
  <!-- Post 1 elements -->
  <circle cx="90" cy="90" r="15" fill="#FF6B9D" opacity="0.6"/>
  <rect x="115" y="80" width="80" height="6" rx="3" fill="#ffffff30"/>
  <rect x="115" y="92" width="60" height="4" rx="2" fill="#ffffff15"/>
  <rect x="72" y="152" width="130" height="4" rx="2" fill="#ffffff20"/>
  <rect x="72" y="162" width="100" height="4" rx="2" fill="#ffffff12"/>
  <!-- Like icon -->
  <text x="72" y="198" font-family="system-ui" font-size="10" fill="#FF6B9D">♥ 2.4k</text>

  <rect x="80" y="240" width="150" height="150" rx="8" fill="#2A1030" stroke="#ffffff10" stroke-width="1" transform="rotate(-3 80 240)"/>
  <rect x="80" y="240" width="150" height="75" rx="8" fill="#C44569" opacity="0.5" transform="rotate(-3 80 240)"/>

  <!-- Right: mock feed grid -->
  <rect x="310" y="55" width="130" height="130" rx="6" fill="#3D1540"/>
  <rect x="310" y="55" width="130" height="65" fill="#C44569" opacity="0.4" rx="6"/>
  <text x="375" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff60" text-anchor="middle">POST 01</text>

  <rect x="450" y="55" width="130" height="130" rx="6" fill="#2A1030"/>
  <rect x="450" y="55" width="130" height="65" fill="#FF6B9D" opacity="0.3" rx="6"/>
  <text x="515" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff60" text-anchor="middle">POST 02</text>

  <rect x="590" y="55" width="130" height="130" rx="6" fill="#3D1540"/>
  <text x="655" y="125" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff60" text-anchor="middle">POST 03</text>

  <rect x="310" y="195" width="130" height="130" rx="6" fill="#2A1030"/>
  <rect x="310" y="325" width="130" height="10" fill="#FF6B9D" opacity="0.3" rx="3"/>

  <rect x="450" y="195" width="130" height="130" rx="6" fill="#3D1540"/>
  <rect x="590" y="195" width="130" height="130" rx="6" fill="#2A1030"/>

  <!-- Brand name overlay -->
  <rect x="310" y="350" width="410" height="2" fill="url(#rose)" opacity="0.6"/>
  <text x="310" y="390" font-family="Georgia, serif" font-size="28" font-weight="400" fill="white" letter-spacing="12">ÉLITE</text>
  <text x="310" y="410" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff50" letter-spacing="4">FASHION · LAGOS</text>

  <!-- IG icon -->
  <rect x="700" y="390" width="24" height="24" rx="6" fill="none" stroke="#ffffff30" stroke-width="1.5"/>
  <circle cx="712" cy="402" r="6" fill="none" stroke="#ffffff30" stroke-width="1.5"/>
  <circle cx="719" cy="395" r="1.5" fill="#ffffff30"/>
  <text x="312" y="430" font-family="system-ui, sans-serif" font-size="8" fill="#FF6B9D">@elitefashionlagos</text>
</svg>