<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#080810"/>
      <stop offset="100%" style="stop-color:#0A1020"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2040"/>
      <stop offset="100%" style="stop-color:#0D1428"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00EFFE" stop-opacity="0.4"/>
      <stop offset="100%" style="stop-color:#00EFFE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#vidBg)"/>

  <!-- Film grain overlay suggestion -->
  <rect width="800" height="450" fill="url(#glow)" opacity="0.06"/>

  <!-- Cinematic letterbox bars -->
  <rect x="0" y="0" width="800" height="45" fill="black"/>
  <rect x="0" y="405" width="800" height="45" fill="black"/>

  <!-- Main frame content -->
  <!-- Product: phone/device showcase -->
  <rect x="290" y="80" width="220" height="290" rx="24" fill="#1A2040" stroke="#00EFFE" stroke-width="0.5" opacity="0.7"/>
  <rect x="302" y="94" width="196" height="262" rx="16" fill="url(#screen)"/>

  <!-- Screen content suggestion -->
  <rect x="320" y="110" width="160" height="100" rx="8" fill="#00EFFE" opacity="0.08"/>
  <circle cx="400" cy="160" r="30" fill="#00EFFE" opacity="0.12"/>
  <circle cx="400" cy="160" r="18" fill="#00EFFE" opacity="0.1"/>

  <!-- App UI lines on screen -->
  <rect x="322" y="222" width="156" height="6" rx="3" fill="#ffffff10"/>
  <rect x="322" y="234" width="120" height="4" rx="2" fill="#ffffff08"/>
  <rect x="322" y="248" width="140" height="4" rx="2" fill="#ffffff08"/>
  <rect x="322" y="270" width="70" height="22" rx="11" fill="#00EFFE" opacity="0.25"/>
  <text x="357" y="285" font-family="system-ui, sans-serif" font-size="8" fill="#00EFFE" text-anchor="middle" opacity="0.8">PAY NOW</text>

  <!-- Glow under device -->
  <ellipse cx="400" cy="390" rx="100" ry="10" fill="#00EFFE" opacity="0.08"/>

  <!-- Play button overlay -->
  <circle cx="400" cy="225" r="36" fill="white" opacity="0.08"/>
  <circle cx="400" cy="225" r="28" fill="white" opacity="0.12" stroke="white" stroke-width="1" stroke-opacity="0.3"/>
  <polygon points="393,213 393,237 418,225" fill="white" opacity="0.9"/>

  <!-- Top-left: duration badge -->
  <rect x="60" y="60" width="52" height="22" rx="4" fill="#00EFFE" opacity="0.9"/>
  <text x="86" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#0A0A0A" text-anchor="middle" font-weight="700">0:30</text>

  <!-- Bottom info -->
  <text x="60" y="385" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff40" letter-spacing="3">E-COMMERCE</text>
  <text x="60" y="400" font-family="Georgia, serif" font-size="20" fill="white" letter-spacing="1">Product Launch Ad</text>
  <text x="60" y="418" font-family="system-ui, sans-serif" font-size="9" fill="#00EFFE" letter-spacing="2">30-SECOND SPOT · 4K</text>

  <!-- Right side: specs -->
  <text x="720" y="80" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff30" text-anchor="middle" letter-spacing="1">4K UHD</text>
  <text x="720" y="95" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff30" text-anchor="middle">60fps</text>
</svg>