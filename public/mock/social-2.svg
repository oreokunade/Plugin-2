<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#FFF5F7"/>

  <!-- Quote card style -->
  <rect x="40" y="40" width="520" height="520" rx="12" fill="white" stroke="#FFD6E5" stroke-width="1.5"/>

  <!-- Top stripe -->
  <rect x="40" y="40" width="520" height="6" rx="3" fill="#FF6B9D"/>

  <!-- Large quote mark -->
  <text x="80" y="180" font-family="Georgia, serif" font-size="120" fill="#FF6B9D" opacity="0.12">"</text>

  <!-- Quote text -->
  <text x="300" y="220" font-family="Georgia, serif" font-size="22" fill="#1A0A1E" text-anchor="middle" font-style="italic">Style is a way to say</text>
  <text x="300" y="252" font-family="Georgia, serif" font-size="22" fill="#1A0A1E" text-anchor="middle" font-style="italic">who you are without</text>
  <text x="300" y="284" font-family="Georgia, serif" font-size="22" fill="#C44569" text-anchor="middle" font-style="italic">having to speak.</text>

  <!-- Attribution -->
  <rect x="250" y="310" width="100" height="1" fill="#FFD6E5"/>
  <text x="300" y="332" font-family="system-ui, sans-serif" font-size="11" fill="#C44569" text-anchor="middle" letter-spacing="1">Rachel Zoe</text>

  <!-- Brand lockup -->
  <text x="300" y="460" font-family="Georgia, serif" font-size="28" fill="#1A0A1E" text-anchor="middle" letter-spacing="8">ÉLITE</text>
  <text x="300" y="480" font-family="system-ui, sans-serif" font-size="9" fill="#C44569" text-anchor="middle" letter-spacing="4">FASHION · LAGOS</text>

  <!-- Dots decoration -->
  <circle cx="200" cy="520" r="3" fill="#FF6B9D" opacity="0.4"/>
  <circle cx="215" cy="520" r="3" fill="#FF6B9D" opacity="0.25"/>
  <circle cx="230" cy="520" r="3" fill="#FF6B9D" opacity="0.15"/>
  <circle cx="370" cy="520" r="3" fill="#FF6B9D" opacity="0.15"/>
  <circle cx="385" cy="520" r="3" fill="#FF6B9D" opacity="0.25"/>
  <circle cx="400" cy="520" r="3" fill="#FF6B9D" opacity="0.4"/>
</svg>