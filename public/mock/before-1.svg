<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Old cluttered brand — dated 2015-era feel -->
  <rect width="600" height="600" fill="#F0EDE6"/>

  <!-- Busy radial burst -->
  <circle cx="300" cy="280" r="200" fill="none" stroke="#C8B89A" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="300" cy="280" r="150" fill="none" stroke="#C8B89A" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Old logo - overly complex shield -->
  <polygon points="300,100 380,140 380,230 300,270 220,230 220,140" fill="#1A3A6B" stroke="#0D2347" stroke-width="3"/>
  <polygon points="300,120 360,152 360,225 300,255 240,225 240,152" fill="#2456A4"/>
  <!-- Star inside -->
  <polygon points="300,148 310,175 338,175 316,192 324,220 300,203 276,220 284,192 262,175 290,175" fill="#FFD700"/>

  <!-- OLD wordmark — too many fonts, bad spacing -->
  <text x="300" y="320" font-family="Times New Roman, serif" font-size="28" font-weight="900" fill="#1A3A6B" text-anchor="middle" letter-spacing="-1">NOVA CAPITAL</text>
  <text x="300" y="344" font-family="Arial, sans-serif" font-size="11" fill="#C8A020" text-anchor="middle" letter-spacing="3">INVESTMENT SOLUTIONS</text>

  <!-- Gradient swoosh — very 2010 -->
  <path d="M 100 370 Q 300 340 500 370" stroke="#C8A020" stroke-width="3" fill="none"/>
  <path d="M 100 375 Q 300 345 500 375" stroke="#1A3A6B" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Tagline junk -->
  <text x="300" y="410" font-family="Comic Sans MS, cursive" font-size="13" fill="#888" text-anchor="middle" font-style="italic">"Your trusted partner in financial growth"</text>

  <!-- Drop shadow effect (bad) -->
  <rect x="170" y="425" width="260" height="40" rx="0" fill="#1A3A6B"/>
  <text x="300" y="451" font-family="Arial, sans-serif" font-size="13" fill="#FFD700" text-anchor="middle" font-weight="bold" letter-spacing="1">CONTACT US: 080-1234-5678</text>

  <!-- BEFORE label -->
  <rect x="20" y="20" width="90" height="28" rx="4" fill="#e53e3e"/>
  <text x="65" y="39" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">BEFORE</text>
</svg>